settings:
  rate_limit_s: 2.0
  cache_ttl_s: 86400
  user_agent: "residency-radar/0.1 (personal research; https://github.com/davitens/residency-radar)"

# type: page       -> program page; ranked via its specific offer pages (offer_links / auto-discovery),
#                     or the page itself as a program_page when no specific offer exists
# type: greenhouse | lever | ashby -> public ATS JSON of specific, active offers
#
# offer_links: explicit list of specific offer/apply URLs for a program.
#   []  = program has no separate offer page; rank the program page itself.
#   omitted = auto-discover same-domain /apply,/residency,/fellowship,/program/<x> links.
sources:
  # --- residency / fellowship programs ------------------------------------
  - name: "MATS"
    type: page
    url: "https://www.matsprogram.org/"
    org: "MATS"
    title: "ML Alignment Theory Scholars (MATS)"
    offer_links: ["https://www.matsprogram.org/residency"]
